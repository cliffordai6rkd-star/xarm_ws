# Native ACT: policy_config.pkl + dataset_stats.pkl + policy_*.ckpt。
policy:
  type: act
  checkpoint: ../../../act/outputs/erase_board_joint/policy_best.ckpt
  source_path: ../../../act
  dataset_path: ../../runs/erase_board_lerobotv3  # 原始训练图像尺寸、FPS
  action_key: action.joint  # 部署动作是七轴绝对关节角，rad
  device: cuda:0
  torch_threads: 1
  brightness_jitter: 0.2  # 每次预测随机亮度倍率 0.8~1.2；0 关闭，范围 [0,1]
  brightness_seed: 0  # 固定随机序列；null 每次启动重新随机
  # 由 scripts/train_act_joint.sh 训练原始 action.joint，保留关节角单位 rad。
hardware_config: ../../gello_teleop/config/xarm7_gello_dual_dataset.yaml
active_arms: null
observation:
  camera_map: {


  }
  maximum_camera_age_s: 0.3
  maximum_camera_skew_s: 0.06s
  maximum_state_age_s: 0.15
  maximum_alignment_gap_s: 0.15
execution:
  control_hz: 100
  action_rate_hz: null
  maximum_prediction_age_s: 1.0
  startup_timeout_s: 15
