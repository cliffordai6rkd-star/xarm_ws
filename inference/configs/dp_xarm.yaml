# Independent DP entry point. Replace robot.urdf_path and the collection
# profile before using an xArm; no Nero URDF or checkpoint is implicit here.
dp_checkpoint:
  path: ../../model/dp/pretrained_model-20260901T082955Z-1-001/pretrained_model
  dino_model_path: null
  device: cuda:0
  use_ema: true

action: joint  # matches the bundled checkpoint's action.joint contract; replace with an xArm-compatible checkpoint as needed
architecture: {enabled: true, policy_type: lerobotdp, world_model_type: none}
predictor: {enabled: false, mode: wrench_gru, inference_mode: asynchronous, action_chunk_mode: all, action_condition_fill: chunk, action_execution_mode: chunk, action_step_s: 0.04}
execution: {mode: q, mtc_alpha: 1.0, mtc_q_cmd_source: wm_state}
dp_sampling: {method: ddim, num_inference_steps: 8, use_tau_ext_observation: false}
robot:
  urdf_path: ../../urdf/xarm/REPLACE_WITH_MATCHING_XARM_URDF.urdf
  frame_name: tcp
  action_frame_name: tcp
  locked_joint_names: []
runtime:
  collection_config: ../../configs/mock_collection.yaml
  arm_pair: mock_arm
  camera: null
  maximum_state_age_s: 0.1
  maximum_observation_alignment_gap_s: 0.03
  maximum_inference_steps: 3000
  command_kd: [0, 0, 0, 0, 0, 0, 0]
observation_protection: {enabled: false, warmup_duration_s: 2.0, wrench_median_window: 1, wrench_lowpass_cutoff_hz: 5.0}
safety: {maximum_action_translation_step_m: 0.05, maximum_action_rotation_step_rad: 0.5, maximum_target_force_n: 40.0, maximum_target_moment_nm: 5.0, maximum_command_torque_nm: 25.0, maximum_joint_position_step_rad: 0.1}
timing: {enabled: true, report_interval_s: 1.0}
wrench_visualization: {enabled: false, window_s: 10.0, update_rate_hz: 20.0}
ik: {max_iterations: 100, position_tolerance_m: 0.0001, rotation_tolerance_rad: 0.001, damping: 0.001, step_gain: 1.0, maximum_iteration_step_rad: 0.2, joint_position_margin_rad: 0.02}
