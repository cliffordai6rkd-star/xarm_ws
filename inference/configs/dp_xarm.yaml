# xArm DP 关节推理：路径相对于本 YAML；可用 --checkpoint 指定其他权重。
policy:
  type: dp
  checkpoint: ../../../diffusion_policy/data/outputs/2026.10.03/17.02.43_train_diffusion_transformer_erase_board_eepose_erase_board_eepose_image/checkpoints/latest.ckpt
  device: cuda:0
  use_ema: true
  sampling_method: ddim
  num_inference_steps: 8
  torch_threads: 1
# 复用 IP、active_arms、RGB 相机及有界位置控制参数；不连接 GELLO。
hardware_config: ../../gello_teleop/config/xarm7_gello_dual_dataset.yaml
active_arms: null  # null 沿用硬件配置；双臂 14 维按此列表顺序拆成两个 7 维 q
observation:
  camera_map: {}  # checkpoint key -> 硬件相机名称；默认移除 observation.images. 前缀
  maximum_camera_age_s: 0.3
  maximum_camera_skew_s: 0.06
  maximum_state_age_s: 0.15
  maximum_alignment_gap_s: 0.15
execution:
  control_hz: 100
  action_rate_hz: null  # 自动读取训练 dataset meta/info.json 的 fps；不同于 control_hz
  maximum_prediction_age_s: 1.0
  startup_timeout_s: 15
