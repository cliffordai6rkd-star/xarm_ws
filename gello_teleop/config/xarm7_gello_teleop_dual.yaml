    robot_speed: 20        # deg/s during following
    robot_acc: 100         # deg/s^2 during following
    reset_q: [0.0, 0.0, 0.0, 1.570796, 0.0, 1.570796, 0.0]  # rad; captured from the user-positioned right arm
