active_arms: [
              left,
              right
]  # [left, right] 双臂；[left] 或 [right] 单臂；不影响 cameras 的保存和预览
# Hardware workflow: freshly measured calibration is required.
gello_config: xarm7_gello_calibration.yaml
torque_visualization:
  enabled: true
  urdf_path: ../models/xarm7_dynamics.urdf
  measured_torque_cutoff_hz: 3.0  # tau_ext_cal 的实测 tau 一阶低通，Hz；tau_ext_pred 沿用 force_feedback 滤波
  acceleration_cutoff_hz: 3.0  # 速度差分所得 ddq 一阶低通截止频率，Hz
  window_s: 30.0
  update_hz: 10.0
  stale_s: 0.15
  payload:
    source: controller  # SDK rich report: Studio 中已设置的末端负载质量和法兰系质心
  sides: {}  # left/right 可覆盖模型、重力、截止频率和末端负载
# 主手电流阻尼：覆盖 gello_config 中的设置，不改原点/方向。
# J1..J7 顺序，低强度初始值，须实机调参；原始电流单位不是 Nm。
gello_damping:
  enabled: true
  damping_mode: current
  sample_rate_hz: 10  # 57600 baud 完整读写约 59 ms，留出通信余量；xArm 控制仍为 100 Hz
  damping_gain: [8, 8, 8, 8, 8, 8, 8]  # 原始电流 / (rad/s)
  damping_brake_gain: [8, 8, 8, 8, 8, 8, 8]
  damping_current_limit: [1000,1500,1500,1000,1000,1200,1000]
  damping_velocity_threshold: 0.5  # rad/s，超过后增加阻力，不是硬限速
  damping_velocity_filter_alpha: 0.35
  damping_watchdog_ms: 500
  weak_hold_enabled: false  # 纯阻尼不抗静态重力；弱保持需要另行调试
  weak_hold_gain: [0, 0, 0, 0, 0, 0, 0]
  weak_hold_limit: [5, 5, 5, 5, 5, 5, 5]
  weak_hold_release_velocity: 0.08
  sides:
    right:
      sample_rate_hz: 12  # USB latency=1 ms；完整读写约 59 ms，83.3 ms 周期留出余量
force_feedback:
  enabled: true
  source: urdf
  urdf_path: ../models/xarm7_dynamics.urdf
  measured_torque_cutoff_hz: 3.0  # 实测 tau_m 的一阶低通截止频率，Hz
  acceleration_cutoff_hz: 3.0  # RNEA 输入 ddq 的一阶低通截止频率，Hz
  tau_ext_mean_window: 20  # tau_m - tau_urdf 的滑动均值窗口；按新的有效 xArm 样本计数，1 为不平均
  payload:
    source: controller  # 使用 SDK 缓存中的 Studio 负载质量和法兰系质心
  # tau_ext = mean(tau_m - RNEA(q,dq,ddq))；窗口满后，abs(tau_ext) > threshold_nm 才反馈。
  threshold_nm: [2, 5.5, 1.5, 5.5, 2, 1.5, 1.0] # 接触触发阈值，J1..J7，Nm
  gain_raw_per_nm: [5, 5, 5, 5, 5, 5, 5]  # 力反馈强度：GELLO 原始电流单位 / Nm
  sign: [-1, -1, -1, -1, -1, -1, -1]  # 反馈方向；随后自动乘 GELLO 标定 joint_signs
  # 占 XL330 最大原始电流 1750 的百分比，范围 0~100；这不是官方持续安全电流。
  # round(百分比 * 1750 / 100)；以下仍对应 [20, 20, 15, 15, 15, 15, 15]。
  current_limit_percent: [80, 80, 80, 80, 80, 80, 80]  # 与阻尼相加后仍受 damping_current_limit 限制
  rate_limit_raw_s: 200  # 电流上升变化率；无效/低于阈值时立即归零
  ramp_s: 0.05  # 每次恢复有效反馈后的渐入时间
  maximum_age_s: 0.15  # 模型源状态超龄后只保留阻尼
  maximum_sample_gap_s: 0.03  # 采样中断后清空滤波和均值窗口，重新等待窗口填满
  sides: {}  # left/right 可覆盖模型、负载、滤波、窗口、threshold_nm、gain_raw_per_nm 等

alignment:
  gello_hold_current_raw: 400  # 电流位置模式持续设置 Goal Current=80，非百分比
  gello_reset_steps: 15
  gello_reset_interval_s: 0.2
  gello_reset_max_travel_deg: 90.0
  gello_reset_tracking_error_deg: 10.0
  alignment_samples: 5  # 自动核对采样次数；任一次超限或读取失败立即报错
  reset_speed_rad_s: 0.6  # rad/s，xArm 启动、o 键和退出复位共用
  reset_acc_rad_s2: 0.3
  reset_timeout_s: 60.0
  reset_tolerance_rad: 0.03
  reset_samples: 5
  alignment_tolerance_rad: 0.1
control:
  collision_sensitivity: 0  # 0 关闭碰撞检测；1 最不敏感，5 最敏感；null 保留控制器设置
  sample_rate_hz: 100.0
  leader_max_age_s: 0.15
  leader_startup_timeout_s: 0.5  # 接管前等待两侧连续新样本，仅用于启动
  state_max_age_s: 0.15
  ddq_filter_alpha: 1.0
  sample_queue_size: 256
  deadline_policy: skip  # skip: 延迟后跳过过期指令，按当前时间继续；strict: 超时立即停止
  maximum_lateness_s: 0.03  # skip 模式的警告阈值；strict 模式的停止阈值
  position_mode: second_order
  # 逐轴参考轨迹增益，数组顺序 J1..J7；左右臂共用，非电机力矩增益
  kp: [50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
  kd: [20.0, 20, 20,20, 20.0, 20.0, 20]
  max_velocity_rad_s: 2
  max_acceleration_rad_s2: 4.0
  max_step_rad: 0.01
  max_tracking_error_rad: 0.1
  joint_speed_rad_s:  4
  joint_acc_rad_s2: 4
  sdk_timeout_s: 0.1
arms:
  left:
    execution_enabled: true
    servo_mode: 1
    feedback_signal: torque  # 实测力矩：用于可视化和 tau_free 外力矩反馈
    velocity_source: hardware
    gripper_speed: 5000  # G1 硬件速度（r/min），初始化时下发；-1 保留控制器设置
    gripper_open_position: 800
    gripper_close_position: 0
    gripper_min_width_m: 0.0
    gripper_max_width_m: 0.085
  right:
    execution_enabled: true
    servo_mode: 1
    feedback_signal: torque
    velocity_source: hardware
    gripper_speed: 5000  # 左右可独立设置；不是开口速度 m/s
    gripper_open_position: 800
    gripper_close_position: 0
    gripper_min_width_m: 0.0
    gripper_max_width_m: 0.085
gripper:
  mode: trigger  # follow 开合度映射；trigger 每次按到底切换闭合/张开
  print_on_press: true  # 主手夹爪每次按下打印一次状态，松开后重新触发
  control_mode: absolute_position  # 主手当前开合度直接映射绝对开口，非累计增量
  enabled: true
  command_enabled: true
  sample_rate_hz: 20.0
  max_speed_m_s: 0.02  # 仅 control_mode: rate_limited_position 时生效
require_cameras: true
cameras:
# - name: 'front'
#   backend: realsense
#   serial_number: '262722072129'
#   width: 640
#   height: 480
#   fps: 30
#   output_size: [224, 224]  # 保存 RGB/深度的尺寸；相机采集仍为 640x480@30 Hz
#   depth: true
#   visualize: true  
- name: 'right_wrist'
  backend: realsense
  serial_number: '419122271564'
  width: 640
  height: 480
  fps: 30
  output_size: [224, 224]  # 保存 RGB/深度的尺寸；相机采集仍为 640x480@30 Hz
  depth: false
  visualize: true  # 所有启用的视角拼接到同一个预览窗口
- name: "left_wrist"
  backend: realsense
  serial_number: '419122270270'
  width: 640
  height: 480
  fps: 30
  output_size: [224, 224]  # 保存 RGB/深度的尺寸；相机采集仍为 640x480@30 Hz
  depth: false
  visualize: true
output:
  camera_compression: null  # 缩放后的原始数组直接写 H5，不做 gzip/视频编码
  directory: ../../runs/wipe_vase
  prefix: dual_gello_xarm
  discard_initial_s: 0.0
gello_template: xarm7_gello_teleop_dual.yaml
